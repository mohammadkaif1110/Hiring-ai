- table:
    schema: public
    name: notifications
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter: {}
  event_triggers:
    - name: send_notification
      definition:
        enable_manual: false
        insert:
          columns: "*"
      webhook: "{{NHOST_FUNCTIONS_URL}}/v1/event-trigger-notify"
      retry_conf:
        num_retries: 3
        interval_sec: 10
        timeout_sec: 60

