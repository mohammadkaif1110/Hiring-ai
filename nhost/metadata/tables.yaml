- table:
    schema: public
    name: organizations
  is_enum: false
  configuration:
    column_config: {}
    custom_column_names: {}
    custom_name: null
    custom_root_fields: {}
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - slug
          - quota_limit
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
        check: null
  insert_permissions:
    - role: user
      permission:
        check: {}
        columns:
          - name
          - slug


- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
    - name: user
      using:
        foreign_key_constraint_on: user_id
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - user_id
          - org_id
          - role
        check:
          _or:
            - _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
                - _not:
                    _exists:
                      _table:
                        schema: public
                        name: org_members
                      _where:
                        org_id:
                          _ceq:
                            - "$"
                            - org_id
            - _exists:
                _table:
                  schema: public
                  name: org_members
                _where:
                  user_id:
                    _eq: X-Hasura-User-Id
                  org_id:
                    _ceq:
                      - "$"
                      - org_id
                  role:
                    _eq: owner
  update_permissions:
    - role: user
      permission:
        columns:
          - role
        filter:
          _exists:
            _table:
              schema: public
              name: org_members
            _where:
              user_id:
                _eq: X-Hasura-User-Id
              org_id:
                _ceq:
                  - "$"
                  - org_id
              role:
                _eq: owner
  delete_permissions:
    - role: user
      permission:
        filter:
          _exists:
            _table:
              schema: public
              name: org_members
            _where:
              user_id:
                _eq: X-Hasura-User-Id
              org_id:
                _ceq:
                  - "$"
                  - org_id
              role:
                _eq: owner

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: workflow_steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_steps
    - name: workflow_triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_triggers
    - name: workflow_runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: user
      permission:
        columns: '*'
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        columns:
          - org_id
          - name
          - description
          - is_active
          - created_by
        check:
          _exists:
            _table:
              schema: public
              name: org_members
            _where:
              user_id:
                _eq: X-Hasura-User-Id
              org_id:
                _ceq:
                  - "$"
                  - org_id
              role:
                _in:
                  - owner
                  - editor
        set:
          created_by: X-Hasura-User-Id
  update_permissions:
    - role: user
      permission:
        columns:
          - name
          - description
          - is_active
        filter:
          _exists:
            _table:
              schema: public
              name: org_members
            _where:
              user_id:
                _eq: X-Hasura-User-Id
              org_id:
                _ceq:
                  - "$"
                  - org_id
              role:
                _in:
                  - owner
                  - editor
  delete_permissions:
    - role: user
      permission:
        filter:
          _exists:
            _table:
              schema: public
              name: org_members
            _where:
              user_id:
                _eq: X-Hasura-User-Id
              org_id:
                _ceq:
                  - "$"
                  - org_id
              role:
                _eq: owner

