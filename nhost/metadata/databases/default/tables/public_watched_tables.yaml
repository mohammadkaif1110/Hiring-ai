table:
  name: watched_tables
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            org_id:
              _ceq:
                - $
                - org_id
            role:
              _eq: owner
            user_id:
              _eq: X-Hasura-User-Id
      columns:
        - org_id
        - table_name
        - workflow_id
        - is_active
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
